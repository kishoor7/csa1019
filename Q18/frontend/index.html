<!doctype html><meta charset="utf-8"><title>Task Dashboard</title><style>body{font:20px Arial;background:#edf3f8;color:#12345a;padding:70px}main{background:white;padding:40px;border-radius:10px}input,button{padding:12px;font:inherit}</style><main><h1>Task Dashboard</h1><p>Frontend · Flask API · PostgreSQL</p><form><input id="task" required placeholder="New task"><button>Add</button></form><ul id="tasks"></ul><p id="status"></p></main><script>async function load(){try{let r=await fetch('/api/tasks');if(!r.ok)throw Error();let data=await r.json();document.querySelector('#tasks').replaceChildren(...data.map(x=>{let li=document.createElement('li');li.textContent=x.title;return li}));document.querySelector('#status').textContent='API connected'}catch(e){document.querySelector('#status').textContent='Backend not connected — start Kubernetes services'}}document.querySelector('form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.querySelector('#task').value})});if(r.ok){document.querySelector('#task').value='';load()}};load()</script>
