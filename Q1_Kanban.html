<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f3f8;color:#172b4d;font:16px Arial,sans-serif}header{background:#143354;color:white;padding:24px 40px}header h1{margin:0 0 6px;font-size:27px}header p{margin:0;color:#d6e2ef;font-size:14px}main{max-width:1280px;margin:32px auto;padding:0 28px}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.intro h2{margin:0 0 8px;font-size:23px}.intro p{margin:0;color:#52647a}.stats{font-weight:bold;color:#234c76}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.column{background:#e3e9f1;padding:16px;border-radius:10px;min-height:350px;border-top:5px solid #728399}.column:nth-child(2){border-top-color:#2875d0}.column:nth-child(3){border-top-color:#27845d}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-weight:bold}.count{background:#d2dce8;padding:4px 10px;border-radius:16px;font-size:13px}.task{background:white;border:1px solid #d4deeb;border-radius:8px;padding:15px;margin-bottom:12px;box-shadow:0 2px 4px #172b4d0a;cursor:grab}.task small{color:#60758c;font-weight:bold}.task h3{font-size:16px;margin:10px 0 18px}.actions{display:flex;justify-content:space-between;gap:8px}button{font:inherit;font-size:12px;border:1px solid #c4d0df;background:white;color:#254e7a;border-radius:5px;padding:7px 9px;cursor:pointer}button:disabled{opacity:.35;cursor:default}.next{background:#e8f1ff;border-color:#c2d9f7}.over{outline:2px dashed #2875d0;outline-offset:-5px}.log{margin-top:22px;background:white;border:1px solid #d4deeb;border-radius:8px;padding:16px 20px}.log h3{margin:0 0 10px;font-size:16px}.log p{margin:7px 0;font-size:14px;color:#52647a}@media(max-width:700px){.board{grid-template-columns:1fr}.intro{display:block}.stats{margin-top:12px}}
</style>
</head>
<body>
<header><h1>Kanban Board</h1><p>CSA10 Software Engineering | Experiment 01 | Standalone workflow simulation</p></header>
<main>
<div class="intro"><div><h2>Software Development Project</h2><p>Drag tasks between columns or use the navigation buttons.</p></div><div class="stats" id="stats"></div></div>
<div class="board" id="board"></div>
<section class="log"><h3>Workflow activity</h3><div id="activity">No tasks moved yet.</div></section>
</main>
<script>
const stages = ['To Do', 'In-Progress', 'Done'];
const tasks = [
  {id:'TASK-01', title:'Gather project requirements', status:0},
  {id:'TASK-02', title:'Design user interface', status:0},
  {id:'TASK-03', title:'Develop login module', status:0},
  {id:'TASK-04', title:'Create database schema', status:0},
  {id:'TASK-05', title:'Test application features', status:0},
  {id:'TASK-06', title:'Prepare project documentation', status:0}
];
const history = [];
function move(id, status) {
  const task = tasks.find(t => t.id === id);
  if (!task || status < 0 || status > 2 || status === task.status) return;
  history.unshift(`${task.id} | ${task.title}: ${stages[task.status]} → ${stages[status]}`);
  task.status = status;
  render();
}
function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  stages.forEach((stage, i) => {
    const items = tasks.filter(t => t.status === i);
    const column = document.createElement('section');
    column.className = 'column';
    column.innerHTML = `<div class="heading">${stage}<span class="count">${items.length}</span></div>`;
    column.ondragover = e => { e.preventDefault(); column.classList.add('over'); };
    column.ondragleave = () => column.classList.remove('over');
    column.ondrop = e => { e.preventDefault(); column.classList.remove('over'); move(e.dataTransfer.getData('text/plain'), i); };
    items.forEach(task => {
      const card = document.createElement('article');
      card.className = 'task'; card.draggable = true; card.id = task.id;
      card.ondragstart = e => e.dataTransfer.setData('text/plain', task.id);
      card.innerHTML = `<small>${task.id}</small><h3>${task.title}</h3><div class="actions"><button ${i === 0 ? 'disabled' : ''} onclick="move('${task.id}',${i-1})">← Back</button><button class="next" ${i === 2 ? 'disabled' : ''} onclick="move('${task.id}',${i+1})">Next →</button></div>`;
      column.appendChild(card);
    });
    board.appendChild(column);
  });
  document.getElementById('stats').textContent = `${tasks.length} tasks · ${tasks.filter(t => t.status === 2).length} completed`;
  document.getElementById('activity').innerHTML = history.length ? history.slice(0,6).map(h=>`<p>${h}</p>`).join('') : 'No tasks moved yet.';
}
render();
// Simulate a sample workflow by moving tasks across the columns.
move('TASK-01', 1); move('TASK-01', 2);
move('TASK-02', 1); move('TASK-02', 2);
move('TASK-03', 1); move('TASK-04', 1);
</script>
</body>
</html>
