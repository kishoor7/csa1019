apiVersion: apps/v1
kind: Deployment
metadata: {name: lab-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: lab-api}}
  template:
    metadata: {labels: {app: lab-api}}
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          ports: [{containerPort: 5000}]
